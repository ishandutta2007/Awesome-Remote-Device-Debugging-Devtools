<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .data-wire {
      stroke-dasharray: 12, 12;
      animation: dashStream 20s linear infinite;
    }
    .data-wire-fast {
      stroke-dasharray: 8, 8;
      animation: dashStream 10s linear infinite;
    }
    .float-card-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: floatPillReverse 6s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs (Background layer) -->
  <circle cx="150" cy="180" r="160" fill="url(#glowGrad)" class="pulsing-glow" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="180" fill="url(#glowGrad)" class="pulsing-glow" filter="url(#glow)" />

  <!-- Dynamic Data Packet Highway / Trace Lines (Background) -->
  <path d="M 0 100 Q 300 40 600 120 T 1200 80" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" class="data-wire" />
  <path d="M 0 260 Q 400 320 750 240 T 1200 280" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.35" class="data-wire-fast" />
  <path d="M 100 0 C 250 180 350 180 500 360" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
  <path d="M 1100 0 C 950 180 850 180 700 360" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.15" />

  <!-- Dynamic Floating Decorative DevTools Tags (Left & Right Flanks) -->
  <g class="float-card-1" opacity="0.85">
    <!-- Left Top Card: Chrome DevTools Protocol -->
    <rect x="50" y="55" width="160" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="70" cy="76" r="5" fill="#38bdf8" />
    <text x="85" y="81" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CDP / DevTools</text>
  </g>

  <g class="float-card-2" opacity="0.85">
    <!-- Left Bottom Card: ADB Wireless Bridge -->
    <rect x="70" y="255" width="150" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#34d399" stroke-width="1.2" />
    <circle cx="90" cy="276" r="5" fill="#34d399" />
    <text x="105" y="281" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ADB Over TCP</text>
  </g>

  <g class="float-card-2" opacity="0.85">
    <!-- Right Top Card: MITM & SSL Proxy -->
    <rect x="990" y="55" width="160" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="1010" cy="76" r="5" fill="#818cf8" />
    <text x="1025" y="81" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">HTTPS / MITM</text>
  </g>

  <g class="float-card-1" opacity="0.85">
    <!-- Right Bottom Card: Device Farms & Simulators -->
    <rect x="970" y="255" width="170" height="42" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#f472b6" stroke-width="1.2" />
    <circle cx="990" cy="276" r="5" fill="#f472b6" />
    <text x="1005" y="281" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Real Device Farms</text>
  </g>

  <!-- Center Decorative Frame for Title Visibility -->
  <rect x="220" y="45" width="760" height="270" rx="16" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />

  <!-- Foreground Main Title and Typography -->
  <!-- Top Category Pill -->
  <g>
    <rect x="440" y="70" width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
    <text x="600" y="90" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Title -->
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
    Remote Device Debugging
  </text>
  <text x="600" y="205" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">
    &amp; DevTools Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="600" y="250" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    Cloud Device Farms • Mobile Simulators • HTTP/HTTPS MITM Proxies • Remote WebViews • ADB Tools
  </text>

  <!-- Bottom Accent Highlights -->
  <g transform="translate(420, 275)">
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <text x="55" y="16" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">📱 Mobile QA</text>
    
    <rect x="125" y="0" width="110" height="24" rx="12" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="0.8" />
    <text x="180" y="16" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🌐 WebViews</text>
    
    <rect x="250" y="0" width="110" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="0.8" />
    <text x="305" y="16" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">🤖 AI &amp; MCP</text>
  </g>
</svg>
